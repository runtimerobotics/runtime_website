services:
  dev:
    build:
      context: .
      target: development
    container_name: runtime-robotics-dev
    # The source directory is bind-mounted. Ignore a host-side Astro lock file,
    # which can otherwise reference a PID that Docker reuses after a restart.
    command: npm run dev -- --host 0.0.0.0 --ignore-lock --verbose
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Polling makes file watching reliable on Docker Desktop/WSL/Linux bind mounts.
      CHOKIDAR_USEPOLLING: "true"
      # Keep Astro in foreground mode so --ignore-lock works with the bind mount.
      ASTRO_DEV_BACKGROUND: "0"
    restart: unless-stopped

  preview:
    build:
      context: .
      target: production
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        BASE_PATH: ${BASE_PATH:-}
    container_name: runtime-robotics-preview
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  node_modules:
