server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro generates directory-style routes because trailingSlash is enabled.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Astro fingerprints generated assets, so these can be cached aggressively.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep public assets cacheable, but easy to refresh when their filenames stay the same.
    location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
